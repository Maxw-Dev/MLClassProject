# Imitation player bot (T18): learns to play like the people in demos/, against the trained boss (Boss_v2, Inference
# Only). How to record and what the agent sees: MLClassProject/Assets/_Project/ImitationBot/README.md
# Starting point, not tuned yet. Behavioral cloning copies the recordings early on and fades out over `steps`. GAIL
# keeps rewarding "looks like the recordings". The game's own reward (win, damage) is weak on purpose, so the bot gets
# competent without drifting away from how people play.
# demo_path can be one person's folder (demos/max) or all of demos/.
behaviors:
  Player:
    trainer_type: ppo
    hyperparameters:
      batch_size: 256
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false      # PlayerAgent already scales every observation to about -1..1
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 0.1
      gail:
        gamma: 0.99
        strength: 0.5
        demo_path: demos/player
        use_actions: true
    behavioral_cloning:
      demo_path: demos/player
      strength: 0.5
      steps: 150000
    time_horizon: 512
    max_steps: 1000000
    keep_checkpoints: 5
    checkpoint_interval: 200000
    summary_freq: 20000
